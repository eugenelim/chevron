  ==========================================================================
-->

<style>
:root{
  --bg:#0f1115;--surface:#171a21;--surface2:#1f232c;--text:#e6e8ee;--muted:#8b93a7;--accent:#4f8cff;--border:#2a2f3a;
  --on-accent:#fff;--danger:#ef5b5b;--ok:#3ecf8e;--warn:#f0b429;
  --radius:12px;--gap:16px;--pad:14px;--row:6px;--bd-int:.35;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Source Code Pro",monospace;
  --font:var(--sans);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
body[data-font=mono]{--font:var(--mono)}
body[data-font=serif]{--font:ui-serif,Georgia,"Times New Roman",serif}
body[data-font=rounded]{--font:ui-rounded,"SF Pro Rounded","Nunito",var(--sans)}
body[data-density=compact]{--pad:10px;--row:3px;--gap:12px}
body[data-density=spacious]{--pad:20px;--row:9px;--gap:22px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--bd-int)}
body[data-backdrop=dots]::before{background-image:radial-gradient(var(--muted) 1px,transparent 1.4px);background-size:22px 22px}
body[data-backdrop=grid]::before{background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:32px 32px}
body[data-backdrop=gradient]::before{background:radial-gradient(1100px 600px at 0% -10%,var(--accent),transparent 60%),radial-gradient(900px 500px at 110% 110%,var(--accent),transparent 60%)}
body[data-backdrop=aurora]::before{background:linear-gradient(115deg,var(--accent) 0%,transparent 35%,color-mix(in srgb,var(--accent) 50%,#c084fc) 65%,transparent 100%);filter:blur(70px)}
body[data-backdrop=stripes]::before{background:repeating-linear-gradient(45deg,var(--border) 0 2px,transparent 2px 14px)}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.muted{color:var(--muted)}
small{color:var(--muted)}

/* header */
header.top{display:flex;align-items:center;gap:16px;padding:12px 24px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;cursor:default;color:var(--text)}
.brand svg{display:block;width:34px;height:34px}
.brand:hover .lamp{filter:url(#chG) brightness(1.25)}
.pages{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.pages button{background:none;border:1px solid transparent;padding:6px 10px;border-radius:8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.pages button:hover{color:var(--text)}
.pages button.on{color:var(--text);background:var(--surface2);border-color:var(--border)}
.pages .num{display:inline-block;min-width:16px;padding:0 3px;margin-right:6px;font-size:10px;line-height:14px;text-align:center;font-family:var(--mono);border:1px solid var(--border);border-radius:4px;opacity:.8}
.pages button:hover .num,.pages button.on .num{border-color:var(--muted)}
.pages button.drop{outline:2px dashed var(--accent)}
.pages input.tab-edit{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--accent);padding:6px 10px;border-radius:8px;outline:none;min-width:60px}
.spacer{flex:1}
.actions{display:flex;gap:2px}
.ibtn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted);position:relative;padding:0;flex:none}
.ibtn:hover{background:var(--surface2);color:var(--text)}
.ibtn.sm{width:26px;height:26px}
.badge{position:absolute;top:1px;right:1px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;border-radius:8px;padding:0 4px;line-height:15px;min-width:15px}
.clocks{display:flex;gap:18px;padding-left:16px;border-left:1px solid var(--border)}
.clock{text-align:right;line-height:1.15}
.clock .t{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.clock .l .d{text-transform:none;letter-spacing:0}
.clock .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.clock .wx{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap}

.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 24px 0;padding:10px 14px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:10px}
.banner span{flex:1;min-width:200px}

main{padding:24px;max-width:1600px;margin:0 auto;width:100%;box-sizing:border-box;flex:1 0 auto} /* grows so the key legend sits at the bottom of short pages */
.pinned{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--gap)}
.pinned .bm{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px 5px 6px}
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fill,minmax(220px,1fr));align-items:start}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--pad);min-width:0;transition:box-shadow .15s}
.card.span2{grid-column:span 2}
@media (max-width:640px){.card.span2{grid-column:auto}}
.card.dragging{opacity:.4}
.card.drop-before{box-shadow:-3px 0 0 var(--accent)}
.card.drop-after{box-shadow:3px 0 0 var(--accent)}
.card.drop-in{outline:2px dashed var(--accent);outline-offset:2px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:grab;user-select:none;min-height:26px}
.card-h h2{font-size:12px;margin:0;flex:1;text-transform:uppercase;letter-spacing:.08em;color:var(--cat,var(--muted));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.card-h .ci{font-size:15px}
.card-h .ibtn{opacity:0}
.card:hover .card-h .ibtn,.card-h .ibtn:focus{opacity:1}
.card.collapsed .cb{display:none}
.card.collapsed .card-h{margin-bottom:0}
body[data-header=filled] .card-h{background:color-mix(in srgb,var(--cat,var(--accent)) 16%,transparent);margin:calc(var(--pad) * -1) calc(var(--pad) * -1) 10px;padding:8px var(--pad);border-radius:var(--radius) var(--radius) 0 0}
body[data-header=underline] .card-h{border-bottom:2px solid var(--cat,var(--accent));padding-bottom:6px}
body[data-header=plain] .card-h h2{color:var(--text)}

/* styles */
body[data-style=glass] .card,body[data-style=glass] .pinned .bm{background:color-mix(in srgb,var(--surface) 55%,transparent);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-color:color-mix(in srgb,var(--text) 12%,transparent)}
body[data-style=outline] .card{background:transparent}
body[data-style=soft] .card{border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.12)}
body[data-style=terminal]{--font:var(--mono)}
body[data-style=terminal] .card{border-style:dashed;border-radius:2px;background:transparent}
body[data-style=terminal] .card-h h2::before{content:"> ";color:var(--accent)}
body[data-style=terminal] .av{border-radius:2px}

.bms{list-style:none;margin:0;padding:0}
.bm{display:flex;align-items:center;gap:10px;padding:var(--row) 8px;border-radius:8px;text-decoration:none;color:var(--text);min-width:0}
.bm:hover,.bm.hl{background:var(--surface2)}
.bm .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.bm.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.bm.hl kbd{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.av{width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:hsl(var(--h,220) 55% 45%);position:relative;flex:none;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface)}
.av img.broken{display:none}
.av.emoji{background:none;font-size:16px}
kbd{font:11px/1.5 var(--mono);background:var(--surface2);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--danger)}
.addrow{display:block;width:100%;text-align:left;background:none;border:1px dashed transparent;color:var(--muted);padding:4px 8px;border-radius:8px;cursor:pointer;margin-top:4px;opacity:0}
.card:hover .addrow{opacity:1;border-color:var(--border)}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}

/* widgets */
.md{min-height:40px;cursor:text;overflow-wrap:anywhere}
.md p,.md ul,.md ol{margin:0 0 6px}
.md h1,.md h2,.md h3{margin:6px 0;font-size:15px}
.md ul{padding-left:18px}
.md ul.task{list-style:none;padding-left:0}
.md ul.task li{display:flex;gap:6px;align-items:flex-start}
.md ul.task li.done span{text-decoration:line-through;color:var(--muted)}
.md code{font-family:var(--mono);background:var(--surface2);padding:0 4px;border-radius:4px}
.md a{color:var(--accent)}
.notes-ta{min-height:140px;font-family:var(--mono);font-size:13px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h b{cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal .wd{color:var(--muted);font-size:11px;padding:2px 0}
.cal .dd{padding:4px 0;border-radius:6px}
.cal .today{background:var(--accent);color:var(--on-accent);font-weight:700}
.wclocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.wclock .t{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
.wclock .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wxcity{padding:6px 0 10px;border-bottom:1px solid var(--border);margin-bottom:8px}
.wxcity:last-of-type{border-bottom:0}
.wxnow{display:flex;align-items:center;gap:10px}
.wxnow .ic{font-size:28px;line-height:1}
.wxnow .tp{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
.wxdays{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px;text-align:center;font-size:12px}
.wxdays .dn{color:var(--muted)}
.wxdays .hl{font-variant-numeric:tabular-nums}
.wxdays .lo{color:var(--muted)}
.stocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.stk{cursor:pointer;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.stk:hover{border-color:var(--accent)}
.stk .sh{display:flex;justify-content:space-between;padding:5px 8px;font-size:12px}
.stk .sh b{font-family:var(--mono)}
.stk .sc{height:120px;overflow:hidden}
.stk iframe{display:block;width:125%;height:150px;border:0;pointer-events:none;transform:scale(.8);transform-origin:0 0} /* the chart needs ~240px to show its price axis */
.stkchart{height:min(52vh,440px);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.stkchart iframe{width:100%;height:100%;border:0;display:block}
.wxfoot{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wxfoot a{color:var(--muted)}
.clock.haswx{cursor:pointer;border-radius:8px;padding:2px 6px;margin:-2px -6px}
.clock.haswx:hover{background:var(--surface2)}
.wxhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.wxhead .ic{font-size:44px;line-height:1}
.wxhead .tp{font-size:36px;font-weight:650;font-variant-numeric:tabular-nums}
.wxhours{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px}
.wxhours .h{flex:none;width:58px;text-align:center;padding:8px 0;border-radius:10px;background:var(--surface2);font-size:12px}
.wxhours .h.now{box-shadow:inset 0 0 0 2px var(--accent)}
.wxhours .h .ic{font-size:20px;margin:4px 0}
.wxhours .h .tp{font-weight:650;font-size:14px;font-variant-numeric:tabular-nums}
.wxhours .h .pp{color:var(--accent);font-size:11px;min-height:14px}
.wxweek .r{display:grid;grid-template-columns:90px 34px 1fr 52px 44px 1.4fr 44px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.wxweek .r .ic{font-size:20px;text-align:center}
.wxweek .pp{color:var(--accent);font-size:12px;text-align:right}
.wxweek .lo{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.wxweek .hi{font-variant-numeric:tabular-nums}
.wxbar{position:relative;height:6px;border-radius:3px;background:var(--surface2)}
.wxbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#60a5fa,var(--accent),#f97316)}
@media (max-width:640px){.wxweek .r{grid-template-columns:70px 28px 0 40px 36px 1fr 36px}.wxweek .r .ds{display:none}}

.legend{text-align:center;color:var(--muted);font-size:12px;padding:8px 24px 28px}
.legend kbd{margin:0 2px}

/* forms */
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px;width:100%}
textarea{resize:vertical}
input[type=checkbox],input[type=radio],input[type=color],input[type=range]{width:auto;padding:0}
input[type=color]{height:32px;width:44px;border-radius:6px;background:none}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
label.chk{display:flex;gap:8px;align-items:center;margin:8px 0;cursor:pointer}
.btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.on{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.chip{display:inline-flex;gap:4px;align-items:center;padding:1px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;margin:1px}
.chip:hover{color:var(--text)}
.chip.on{border-color:var(--accent);color:var(--accent)}
h4.sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
h4.sec:first-child{margin-top:0}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden}
.modal.wide{width:min(1240px,100%);height:88vh}
.modal>header{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--border)}
.modal>header h3{margin:0;font-size:16px;flex:1}
.mbody{padding:16px 18px;overflow:auto;flex:1;min-height:0}
.mbody.flush{padding:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto;flex:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--accent)}

/* search */
.sbox{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:min(700px,100%);box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.sbox .stabs{display:flex;gap:4px;padding:8px 10px 0}
.sbox input.q{border:0;background:transparent;font-size:18px;padding:12px 18px 14px;border-radius:0;outline:none;border-bottom:1px solid var(--border)}
.res{list-style:none;margin:0;padding:6px;max-height:56vh;overflow:auto}
.res li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;min-width:0}
.res li.on{background:var(--surface2)}
.res li .t{flex:1;min-width:0}
.res li .t>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .sub{color:var(--muted);font-size:12px}
.res .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 10px 2px;cursor:default}
.res .ico{width:20px;text-align:center;flex:none}
.shint{font-size:11.5px;color:var(--muted);padding:8px 14px;border-top:1px solid var(--border)}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--border);z-index:70;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.3);transform:translateX(105%);transition:transform .18s ease}
.drawer:not(.open){visibility:hidden;box-shadow:none}
.drawer.open{transform:none}
.drawer{transition:transform .18s ease,visibility .18s}
.drawer>header{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--border)}
.drawer>header h3{margin:0;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .dbody{padding:16px 18px;overflow:auto;flex:1}
.drawer footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.warn{color:var(--warn);font-size:12px}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.bars{display:flex;align-items:flex-end;gap:2px;height:70px;margin:8px 0;border-bottom:1px solid var(--border)}
.bars i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:1px;opacity:.85}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px}
.kv dt{color:var(--muted)}.kv dd{margin:0}

/* bookmarks view */
.bv{display:grid;grid-template-columns:230px 1fr;height:100%;min-height:0}
.rail{border-right:1px solid var(--border);padding:10px;overflow:auto}
.rail button{display:flex;width:100%;gap:6px;justify-content:space-between;background:none;border:0;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--muted);text-align:left}
.rail button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail button:hover{color:var(--text)}
.rail button.on{background:var(--surface2);color:var(--text)}
.rail h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 8px 4px}
.rail .sub1{padding-left:20px}
.bvmain{display:flex;flex-direction:column;min-height:0;min-width:0}
.toolbar{padding:10px 12px;border-bottom:1px solid var(--border)}
.toolbar select{width:auto}
.bulk{padding:8px 12px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-bottom:1px solid var(--border)}
.bulk select,.bulk input{width:auto}
.list{overflow:auto;flex:1}
.list .r{display:grid;grid-template-columns:22px 22px minmax(140px,2fr) minmax(90px,1.2fr) minmax(90px,1.3fr) 44px 86px 40px 30px;gap:8px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--border);font-size:13px}
.list .r:hover{background:var(--surface2)}
.list .r.hd{position:sticky;top:0;background:var(--surface);z-index:1;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.list .r>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .r a{text-decoration:none}
.list .r a:hover{text-decoration:underline}
.list .gh{padding:10px 12px 4px;font-weight:600;color:var(--muted);font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.score{font:11px var(--mono);padding:1px 5px;border-radius:5px;text-align:center}
.score.hi{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.score.mid{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.score.lo{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger)}
@media (max-width:800px){.bv{grid-template-columns:1fr}.rail{display:none}.list .r{grid-template-columns:22px 22px 1fr 40px 30px}.list .r>:nth-child(4),.list .r>:nth-child(5),.list .r>:nth-child(6),.list .r>:nth-child(7){display:none}}

.irow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.irow .t{flex:1;min-width:180px}
.irow .t a{text-decoration:none;font-weight:500}
.irow select{width:auto;max-width:180px}
.triage{border:1px solid var(--border);border-radius:12px;padding:24px;text-align:center}
.triage h2{margin:4px 0}
.cloud{line-height:2.1}
.cloud .chip{font-size:var(--fs,12px)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.theme{border:2px solid var(--border);border-radius:10px;padding:0;cursor:pointer;overflow:hidden;text-align:left;background:none}
.theme.on{border-color:var(--accent)}
.theme .sw{display:flex;height:34px}
.theme .sw i{flex:1}
.theme .nm{display:block;padding:5px 8px;font-size:12px;background:var(--surface2)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:4px 6px 4px 0;text-align:left;vertical-align:middle}
.tbl th{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}

/* menu, preview, toasts */
.menu{position:fixed;z-index:90;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:4px;min-width:200px;max-height:70vh;overflow:auto}
.menu button{display:flex;width:100%;gap:8px;justify-content:space-between;background:none;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface2)}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.menu .mh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px 2px}
.preview{position:fixed;z-index:80;max-width:320px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;box-shadow:0 12px 40px rgba(0,0,0,.35);pointer-events:none;font-size:13px}
.preview .u{color:var(--muted);font-size:12px;word-break:break-all}
.preview .n{margin-top:6px;white-space:pre-wrap}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;gap:12px;align-items:center;background:var(--text);color:var(--bg);padding:8px 10px 8px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px}
.toast .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
@media (max-width:720px){header.top{padding:10px 14px}.clocks{border-left:0;padding-left:0;width:100%;justify-content:flex-end}main{padding:14px}}
</style>

<script>
(() => {
'use strict';

/* ======================================================================
   Utilities
   ====================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => Date.now();
const DAY = 864e5;
const STOCK_DEFAULTS = ['NASDAQ:AAPL', 'NASDAQ:GOOGL', 'NASDAQ:AMZN'];
const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
const domain = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
const origin = u => { try { return new URL(u).origin; } catch { return ''; } };
const normUrl = u => { u = (u || '').trim(); if (!u) return ''; if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u; return u; };
const validUrl = u => { try { const x = new URL(u); return /^(https?|ftp|file|mailto):$/.test(x.protocol); } catch { return false; } };
const safeHref = u => /^(https?|ftp|mailto|file):/i.test(u || '') ? u : '#';
const looksUrl = t => /^https?:\/\/\S+$/i.test(t) || /^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(t);
const ukey = u => (u || '').toLowerCase().replace(/^[a-z]+:\/\//, '').replace(/^www\./, '').replace(/[/#?]+$/, '');
const normTag = t => String(t || '').trim().toLowerCase().replace(/^#/, '').replace(/\s+/g, '-');
const parseTags = s => [...new Set(String(s || '').split(/[,;]/).map(normTag).filter(Boolean))];
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const isTyping = el => el && (el.matches?.('input,textarea,select') || el.isContentEditable);
const ago = ts => {
  if (!ts) return 'never';

  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';

}
const today = () => new Date().toISOString().slice(0, 10);

const ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',

const I = (n, s = 18) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ======================================================================
   Themes: [bg, surface, surface2, text, muted, accent, border]
   ====================================================================== */
const THEMES = {
  cocoa:     { name: 'Cocoa',      dark: ['#11111b', '#1e1e2e', '#313244', '#cdd6f4', '#a6adc8', '#cba6f7', '#45475a'], light: ['#dce0e8', '#eff1f5', '#e6e9ef', '#4c4f69', '#6c6f85', '#8839ef', '#ccd0da'] },
  nightcity: { name: 'Night City', dark: ['#16161e', '#1a1b26', '#24283b', '#c0caf5', '#9aa5ce', '#7aa2f7', '#292e42'], light: ['#d0d5e3', '#e1e2e7', '#d5d6db', '#3760bf', '#6172b0', '#2e7de9', '#b7c1e3'] },

  ember:     { name: 'Ember',      dark: ['#1d2021', '#282828', '#32302f', '#ebdbb2', '#a89984', '#fabd2f', '#3c3836'], light: ['#f2e5bc', '#fbf1c7', '#f2e5bc', '#3c3836', '#7c6f64', '#b57614', '#e0cfa0'] },

  rose:      { name: 'Rose',       dark: ['#191724', '#1f1d2e', '#26233a', '#e0def4', '#908caa', '#ebbcba', '#2f2b45'], light: ['#f2e9e1', '#fffaf3', '#faf4ed', '#575279', '#797593', '#d7827e', '#e4d9cf'] },
  forest:    { name: 'Forest',     dark: ['#232a2e', '#2d353b', '#343f44', '#d3c6aa', '#9da9a0', '#a7c080', '#3d484d'], light: ['#efebd4', '#fdf6e3', '#f4f0d9', '#5c6a72', '#829181', '#8da101', '#e0dcc7'] },
  ocean:     { name: 'Ocean',      dark: ['#0b1622', '#0f2033', '#152a42', '#dbe7f3', '#7f97b0', '#22d3ee', '#1d3550'], light: ['#e6f1f8', '#ffffff', '#eef5fa', '#0f2033', '#53687e', '#0891b2', '#cfe0ec'] },
  sunset:    { name: 'Sunset',     dark: ['#1a1214', '#24181b', '#2f2024', '#f5e6e8', '#b39499', '#ff7a59', '#3a282c'], light: ['#fbefe9', '#ffffff', '#fdf3ee', '#3a1f1a', '#8a6a64', '#e8552f', '#f0d8ce'] },
  mono:      { name: 'Mono',       dark: ['#0a0a0a', '#141414', '#1e1e1e', '#f0f0f0', '#8a8a8a', '#f0f0f0', '#2a2a2a'], light: ['#f2f2f2', '#ffffff', '#f5f5f5', '#111111', '#6a6a6a', '#111111', '#e2e2e2'] },
  matrix:    { name: 'Phosphor',   dark: ['#000a00', '#001200', '#001a00', '#7dff7d', '#3fb13f', '#00ff41', '#003300'], light: ['#eaf7ea', '#ffffff', '#f0fbf0', '#003300', '#2f6f2f', '#008f11', '#c8e6c8'] },
};
const THEME_KEYS = ['bg', 'surface', 'surface2', 'text', 'muted', 'accent', 'border'];
const lum = hex => { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return 0; const n = parseInt(m[1], 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };

/* ======================================================================
   Defaults & storage
   ====================================================================== */
const DEFAULTS_TEXT = document.getElementById('dash-defaults').textContent;
let DEFAULTS;
try { DEFAULTS = JSON.parse(DEFAULTS_TEXT); } catch (e) { alert('The defaults JSON in this file is invalid:\n' + e.message); DEFAULTS = {}; }
const DEFAULTS_HASH = hashStr(DEFAULTS_TEXT.replace(/\s+/g, ''));
const NS = (DEFAULTS.storageKey || 'dashboard').replace(/[^\w.-]/g, '');
const LS_KEY = NS + ':data:v1', LS_HASH = NS + ':defaultsHash';

const BASE_SETTINGS = {
  theme: 'cocoa', mode: 'system', style: 'solid', font: 'sans', accent: '', backdrop: 'dots', backdropIntensity: 35,
  radius: 12, density: 'comfortable', columns: 0, headerStyle: 'accent',
  newTab: true, favicons: 'google', showShortcuts: true, showPinned: true, previews: true, legend: true,
  pasteToInbox: true, hour12: false, showSeconds: false, showDate: true, weekStart: 0, defaultFinder: 'g', trashDays: 30,
  weather: true,
};

function mkBm(b, catId) {
  const url = normUrl(b.url);
  return {
    id: uid(), categoryId: catId || null, name: b.name || domain(url) || 'Untitled', url,
    tags: (Array.isArray(b.tags) ? b.tags : parseTags(b.tags)).map(normTag).filter(Boolean),
    notes: b.notes || '', shortcut: String(b.shortcut || '').toLowerCase().replace(/[^a-z0-9]/g, ''),
    pinned: !!b.pinned, icon: b.icon || '', created: b.created || now(), opened: 0, openCount: 0, hist: {},
    deleted: 0, snooze: 0, check: null,
  };
}
function mkCat(c, pageId) {
  return {
    id: uid(), pageId, name: c.name || 'Category', icon: c.icon || '', color: c.color || '',
    type: c.type || 'bookmarks', span: c.span === 2 ? 2 : 1, sort: c.sort || 'manual', collapsed: !!c.collapsed, content: c.content || '',
    ...(c.type === 'stocks' ? { symbols: Array.isArray(c.symbols) ? c.symbols.map(String) : [...STOCK_DEFAULTS] } : {}),
  };
}
function fromDefaultsObj(d) {
  const s = {
    version: 1, title: d.title || 'Dashboard', pages: [], categories: [], bookmarks: [],
    collections: (d.collections || []).map(c => ({ id: uid(), name: c.name, query: c.query })),
    clocks: (d.clocks || []).map(normClock),
    finders: (d.finders || []).map(f => ({ key: f.key, name: f.name, url: f.url })),
    settings: { ...BASE_SETTINGS, ...(d.settings || {}) }, activePage: null,
  };
  (d.pages || []).forEach(p => {
    const pid = uid();
    s.pages.push({ id: pid, name: p.name || 'Page' });
    (p.categories || []).forEach(c => {
      const cat = mkCat(c, pid); s.categories.push(cat);
      (c.bookmarks || []).forEach(b => s.bookmarks.push(mkBm(b, cat.id)));
    });
  });
  (d.inbox || []).forEach(b => s.bookmarks.push(mkBm(b, null)));
  if (!s.pages.length) s.pages.push({ id: uid(), name: 'Home' });
  s.activePage = s.pages[0].id;
  return s;
}
const fromDefaults = () => fromDefaultsObj(structuredClone(DEFAULTS));
function normClock(c) {
  const o = { label: c.label || '', timeZone: c.timeZone || 'UTC' };
  if (c.lat !== '' && c.lat != null && c.lon !== '' && c.lon != null && isFinite(c.lat) && isFinite(c.lon)) { o.lat = +c.lat; o.lon = +c.lon; }
  o.unit = c.unit === 'fahrenheit' ? 'fahrenheit' : 'celsius';
  return o;
}

function sanitize(s) {
  s.settings = { ...BASE_SETTINGS, ...(s.settings || {}) };
  for (const k of ['pages', 'categories', 'bookmarks', 'collections', 'clocks', 'finders']) if (!Array.isArray(s[k])) s[k] = [];
  if (!s.pages.length) s.pages.push({ id: uid(), name: 'Home' });
  s.clocks = s.clocks.map(normClock);
  if (!s.pages.some(p => p.id === s.activePage)) s.activePage = s.pages[0].id;
  const keepDays = (s.settings.trashDays || 30) * DAY;
  s.bookmarks = s.bookmarks.filter(b => !(b.deleted && now() - b.deleted > keepDays) && !(b._new && !b.url));
  s.bookmarks.forEach(b => { delete b._new; b.tags = b.tags || []; b.hist = b.hist || {}; });
  return s;
}
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(LS_KEY)); } catch { /* corrupt or blocked */ }
  if (!s || !Array.isArray(s.pages)) s = fromDefaults();
  return sanitize(s);
}

let state = load();
let _dup = null;
let saveT;
function save() {
  _dup = null;
  clearTimeout(saveT);
  saveT = setTimeout(saveNow, 150);
}
function saveNow() {
  clearTimeout(saveT);
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    if (!localStorage.getItem(LS_HASH)) localStorage.setItem(LS_HASH, DEFAULTS_HASH);
  } catch (e) { toast('Could not save: ' + e.message); }
}
function commit() {
  save();
  renderAll();
  if (modalRefresh) modalRefresh();
  if (editing && !$('#drawer').contains(document.activeElement)) renderEditor();
}
addEventListener('beforeunload', saveNow);
addEventListener('storage', e => {
  if (e.key === LS_KEY && e.newValue) { state = load(); _dup = null; renderAll(); if (modalRefresh) modalRefresh(); }
  if (e.key === WX_KEY && e.newValue) { try { wx = JSON.parse(e.newValue) || {}; } catch { wx = {}; } renderWeather(); }
});

/* ======================================================================
   Lookups & helpers
   ====================================================================== */
const bmById = id => state.bookmarks.find(b => b.id === id);
const catById = id => state.categories.find(c => c.id === id);
const pageById = id => state.pages.find(p => p.id === id);
const live = () => state.bookmarks.filter(b => !b.deleted);
const isInbox = b => !b.categoryId || !catById(b.categoryId);
const catOf = b => isInbox(b) ? null : catById(b.categoryId);
const pageOf = b => { const c = catOf(b); return c ? pageById(c.pageId) : null; };
const pageCats = (pid = state.activePage) => state.categories.filter(c => c.pageId === pid);
const catPath = b => { const c = catOf(b); return c ? `${pageById(c.pageId)?.name || ''} › ${c.name}` : 'Inbox'; };
const inboxVisible = () => state.bookmarks.filter(b => !b.deleted && isInbox(b) && !(b.snooze > now()));
function sortBms(list, sort) {
  if (sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
  else if (sort === 'count') list.sort((a, b) => (b.openCount || 0) - (a.openCount || 0));
  else if (sort === 'opened') list.sort((a, b) => (b.opened || 0) - (a.opened || 0));
  else if (sort === 'added') list.sort((a, b) => b.created - a.created);
  return list;
}
const catBms = cid => sortBms(state.bookmarks.filter(b => !b.deleted && b.categoryId === cid), catById(cid)?.sort);
function dupMap() {
  if (!_dup) { _dup = new Map(); live().forEach(b => { const k = ukey(b.url); if (k) _dup.set(k, (_dup.get(k) || 0) + 1); }); }
  return _dup;
}
const isDup = b => (dupMap().get(ukey(b.url)) || 0) > 1;
function tagCounts() {
  const m = new Map();
  live().forEach(b => b.tags.forEach(t => m.set(t, (m.get(t) || 0) + 1)));
  return m;
}
function score(b) {
  let s = 100; const issues = [];
  if (!validUrl(b.url)) { s -= 40; issues.push('Invalid URL'); }
  else if (/^http:/i.test(b.url)) { s -= 10; issues.push('Not HTTPS'); }
  if (!b.tags.length) { s -= 10; issues.push('No tags'); }
  if (isDup(b)) { s -= 25; issues.push('Duplicate'); }
  if (!b.openCount) { if (now() - b.created > 14 * DAY) { s -= 15; issues.push('Never opened'); } }
  else if (now() - b.opened > 60 * DAY) { s -= 15; issues.push('Not opened in 60 days'); }
  if (b.check && !b.check.ok) { s -= 30; issues.push('Unreachable at last check'); }
  return { s: Math.max(0, s), issues };
}
const scoreCls = s => s >= 85 ? 'hi' : s >= 65 ? 'mid' : 'lo';
function catOptions(sel) {
  return state.pages.map(p => {
    const cs = pageCats(p.id).filter(c => c.type === 'bookmarks');
    return cs.length ? `<optgroup label="${esc(p.name)}">${cs.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>` : '';
  }).join('');
}
function firstBmCat(pid = state.activePage, create = true) {
  let c = pageCats(pid).find(c => c.type === 'bookmarks');
  if (!c && create) { c = mkCat({ name: 'Bookmarks' }, pid); state.categories.push(c); }
  return c;
}
function unsortedCat() {
  let c = state.categories.find(c => c.type === 'bookmarks' && c.name === 'Unsorted');
  if (!c) { c = mkCat({ name: 'Unsorted', icon: '📥' }, state.pages[0].id); state.categories.push(c); }
  return c;
}
function faviconUrl(url) {
  const h = (() => { try { return new URL(url).hostname; } catch { return ''; } })();
  if (!h || !/^https?:/i.test(url)) return '';
  switch (state.settings.favicons) {
    case 'google': return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=64`;
    case 'duckduckgo': return `https://icons.duckduckgo.com/ip3/${encodeURIComponent(h)}.ico`;
    case 'site': return origin(url) + '/favicon.ico';
    default: return '';
  }
}
function avatar(b) {
  if (b.icon && !/^(https?:|data:)/i.test(b.icon)) return `<span class="av emoji">${esc(b.icon)}</span>`;
  const letter = esc((b.name || '?').trim().charAt(0).toUpperCase() || '?');
  const src = b.icon || faviconUrl(b.url);
  return `<span class="av" style="--h:${hue(domain(b.url) || b.name)}">${letter}${src ? `<img class="fav" src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}</span>`;
}
document.addEventListener('error', e => { if (e.target.matches?.('img.fav')) e.target.classList.add('broken'); }, true);

/* ======================================================================
   Look
   ====================================================================== */
const mq = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => state.settings.mode === 'system' ? mq.matches : state.settings.mode === 'dark';
function applyLook() {
  const s = state.settings, dark = isDark();
  const t = (THEMES[s.theme] || THEMES.cocoa)[dark ? 'dark' : 'light'];
  const r = document.documentElement.style;
  THEME_KEYS.forEach((k, i) => r.setProperty('--' + k, t[i]));
  const accent = s.accent || t[5];
  r.setProperty('--accent', accent);
  r.setProperty('--on-accent', lum(accent) > 0.6 ? '#111' : '#fff');
  r.setProperty('--radius', (s.radius ?? 12) + 'px');
  r.setProperty('--bd-int', (s.backdropIntensity ?? 35) / 100);
  r.colorScheme = dark ? 'dark' : 'light';
  Object.assign(document.body.dataset, { style: s.style, backdrop: s.backdrop, density: s.density, font: s.font, header: s.headerStyle });
  const mb = $('#modeBtn');
  if (mb) mb.innerHTML = I(dark ? 'sun' : 'moon');
}
mq.addEventListener?.('change', () => { if (state.settings.mode === 'system') { applyLook(); renderPage(); } });
function toggleMode() {
  state.settings.mode = isDark() ? 'light' : 'dark';
  commit();
  toast(`${state.settings.mode === 'dark' ? 'Dark' : 'Light'} mode`);
}
function randomTheme() {
  const ks = Object.keys(THEMES).filter(k => k !== state.settings.theme);
  state.settings.theme = ks[Math.floor(Math.random() * ks.length)];
  commit();
  toast('Theme: ' + THEMES[state.settings.theme].name);
}

/* ======================================================================
   Render: header, clocks, page
   ====================================================================== */
function renderAll() {
  applyLook();
  renderHeader();
  renderClocks();
  renderPage();
  renderLegend();
  renderBanner();
}
function renderHeader() {
  document.title = state.title;
  const brand = $('#brand');
  brand.title = `${state.title} — double-click to rename`; brand.setAttribute('aria-label', state.title);
  // Only rebuild the tabs when the pages change, so switching pages keeps the same elements (double-click to rename needs that)
  const tabs = state.pages.map((p, i) =>

  const old = new Map([...grid.children].filter(e => e.dataset.sig).map(e => [e.dataset.sig, e]));
  [...grid.children].forEach(e => { if (!e.dataset.sig) e.remove(); });
  let cur = grid.firstElementChild;
  for (const n of [...t.content.children]) {
    if (n.dataset.sig && old.get(n.dataset.sig) === cur) { old.delete(n.dataset.sig); cur = cur.nextElementSibling; continue; }
    grid.insertBefore(n, cur);
  }
  old.forEach(e => e.remove());
}

const notesEditing = new Set();
function md(src) {
  const lines = esc(src || '').split('\n');
  let out = '', list = null, ci = 0;
  const inline = s => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const open = t => { if (list !== t) { close(); out += t === 'task' ? '<ul class="task">' : `<${t}>`; list = t; } };
  const close = () => { if (list) out += list === 'task' ? '</ul>' : `</${list}>`; list = null; };
  for (const ln of lines) {
    let m;
    if ((m = ln.match(/^\s*[-*] \[( |x|X)\] ?(.*)$/))) { open('task'); const done = m[1] !== ' '; out += `<li class="${done ? 'done' : ''}"><input type="checkbox" data-ci="${ci++}" ${done ? 'checked' : ''}><span>${inline(m[2])}</span></li>`; }
    else if ((m = ln.match(/^\s*[-*] (.*)$/))) { open('ul'); out += `<li>${inline(m[1])}</li>`; }
    else if ((m = ln.match(/^\s*\d+[.)] (.*)$/))) { open('ol'); out += `<li>${inline(m[1])}</li>`; }
    else {
      close();
      if ((m = ln.match(/^(#{1,3}) (.*)$/))) out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;
      else if (/^\s*---+\s*$/.test(ln)) out += '<hr>';
      else if (ln.trim()) out += `<p>${inline(ln)}</p>`;
    }
  }
  close();
  return out;
}
function notesHTML(c) {
  if (notesEditing.has(c.id)) return `<textarea class="notes-ta" data-notes="${c.id}" placeholder="Markdown: # heading, - list, - [ ] task, **bold**, \`code\`, [link](https://…)">${esc(c.content)}</textarea><div class="row" style="margin-top:6px"><button class="btn sm" data-act="notesDone" data-id="${c.id}">Done</button><small>Saved as you type</small></div>`;
  return `<div class="md" data-notesview="${c.id}" title="Double-click to edit">${md(c.content) || '<p class="muted">Double-click to write notes…</p>'}</div>`;
}
const calOff = {};
function calHTML(c) {
  const off = calOff[c.id] || 0, d = new Date(), ws = +state.settings.weekStart || 0;
  const first = new Date(d.getFullYear(), d.getMonth() + off, 1);
  const lead = (first.getDay() - ws + 7) % 7, days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const wd = [...Array(7)].map((_, i) => new Date(2024, 0, 7 + ((i + ws) % 7)).toLocaleDateString([], { weekday: 'narrow' }));
  let cells = wd.map(w => `<div class="wd">${w}</div>`).join('') + '<div></div>'.repeat(lead);
  for (let i = 1; i <= days; i++) cells += `<div class="dd ${off === 0 && i === d.getDate() ? 'today' : ''}">${i}</div>`;
  return `<div class="cal-h"><button class="ibtn sm" data-act="calNav" data-id="${c.id}" data-d="-1">‹</button><b data-act="calNav" data-id="${c.id}" data-d="0" title="Back to today">${first.toLocaleDateString([], { month: 'long', year: 'numeric' })}</b><button class="ibtn sm" data-act="calNav" data-id="${c.id}" data-d="1">›</button></div><div class="cal">${cells}</div>`;
}

function moveCat(id, targetId, after) {
  if (id === targetId) return;

  const [c] = arr.splice(i, 1);
  let j = arr.findIndex(x => x.id === targetId);

function withUndo(msg, fn) {

function toast(msg, { action, fn, ms = 5000 } = {}) {

/* ---------- link checks ---------- */
async function checkLink(b) {
  if (!/^https?:/i.test(b.url)) { b.check = { ok: false, ms: 0, at: now(), err: 'Not an http(s) link' }; return b.check; }
  const t0 = performance.now(), ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 10000);
  try {
    await fetch(b.url, { mode: 'no-cors', cache: 'no-store', credentials: 'omit', signal: ctl.signal, referrerPolicy: 'no-referrer' });
    b.check = { ok: true, ms: Math.round(performance.now() - t0), at: now() };
  } catch (e) {
    b.check = { ok: false, ms: Math.round(performance.now() - t0), at: now(), err: e.name === 'AbortError' ? 'Timed out' : 'Unreachable' };
  } finally { clearTimeout(tm); }
  return b.check;
}
async function checkAll(list = live()) {
  const q = list.filter(b => /^https?:/i.test(b.url));
  if (!q.length) return toast('No web links to check.');
  toast(`Checking ${q.length} link(s)…`);
  let i = 0, bad = 0;
  const worker = async () => { while (i < q.length) { const b = q[i++]; if (!(await checkLink(b)).ok) bad++; } };
  await Promise.all([1, 2, 3, 4].map(worker));
  commit();
  toast(`Checked ${q.length} link(s): ${q.length - bad} reachable, ${bad} unreachable.`);
}

function renamePage(id) {
  const p = pageById(id), tab = $(`#pages [data-droppage="${id}"]`); if (!p || !tab) return;
  const inp = document.createElement('input');
  inp.className = 'tab-edit'; inp.value = p.name; inp.setAttribute('aria-label', 'Page name');
  const fit = () => { inp.style.width = `calc(${Math.max(inp.value.length, 4) + 1}ch + 22px)`; };
  let done = false;
  const finish = ok => {
    if (done) return; done = true;
    const n = inp.value.trim();
    inp.remove(); tab.hidden = false;
    if (ok && n && n !== p.name) { p.name = n; commit(); }
  };
  inp.addEventListener('input', fit);
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') finish(true); else if (e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
  ['click', 'dblclick', 'mousedown', 'contextmenu'].forEach(t => inp.addEventListener(t, e => e.stopPropagation()));
  tab.hidden = true; tab.after(inp); fit(); inp.focus(); inp.select();
}

function ibClick(e) {

  else if (a === 'open') openBm(bmById(id), true);
  else if (a === 'edit') openEditor(id);

function ibKeys(e) {
  if (e.key === 't') { IB.triage = !IB.triage; IB.idx = 0; ibRefresh(); return true; }
  if (!IB.triage) return false;
  const items = inboxItems(), b = items[IB.idx];
  if (e.key === 'ArrowRight' || e.key === 'j' || e.key === 'n') { IB.idx = Math.min(items.length - 1, IB.idx + 1); ibRefresh(); return true; }
  if (e.key === 'ArrowLeft') { IB.idx = Math.max(0, IB.idx - 1); ibRefresh(); return true; }
  if (!b) return false;
  if (e.key === 'o') { openBm(b, true); return true; }
  if (e.key === 'k') { keep(b.id); return true; }
  if (e.key === 's') { snooze(b.id, 7); return true; }
  if (e.key === 'd') { deleteBm(b.id); return true; }
  if (e.key === 'e') { openEditor(b.id); return true; }

  return false;
}

function stClick(e) {
  const el = e.target.closest('[data-sta]'); if (!el) return;
  const a = el.dataset.sta, i = +el.dataset.i, id = el.dataset.id;
  const re = () => { commit(); stRefresh(); };
  switch (a) {
    case 'clockAdd': state.clocks.push({ label: 'UTC', timeZone: 'UTC' }); re(); break;
    case 'clockLocal': useMyLocation(() => stRefresh()); break;
    case 'citySearch': {
      const q = $('#citySearch').value.trim(); if (!q) break;
      el.textContent = 'Searching…';
      searchCity(q).then(rs => { cityResults = rs; if (!rs.length) toast('No places found for “' + q + '”.'); }, err => toast('City search failed: ' + err.message))
        .finally(() => { stRefresh(); const i = $('#citySearch'); if (i) { i.value = q; i.focus(); } });
      break;
    }
    case 'cityAdd': {
      const r = cityResults[i]; if (!r) break;
      state.clocks.push(normClock({ label: r.name, timeZone: r.timezone || 'UTC', lat: +r.latitude.toFixed(2), lon: +r.longitude.toFixed(2), unit: r.country_code === 'US' ? 'fahrenheit' : 'celsius' }));
      cityResults = []; re(); refreshWeather(true); toast(`Added ${r.name}`);
      break;
    }
    case 'wxRefresh': refreshWeather(true); toast('Refreshing weather…'); break;
    case 'clockDel': state.clocks.splice(i, 1); re(); break;
    case 'clockUp': if (i > 0) { [state.clocks[i - 1], state.clocks[i]] = [state.clocks[i], state.clocks[i - 1]]; re(); } break;
    case 'finderAdd': state.finders.push({ key: 'x', name: 'New finder', url: 'https://example.com/search?q=%s' }); re(); break;
    case 'finderDel': state.finders.splice(i, 1); re(); break;
    case 'pageUp': movePage(id, -1); stRefresh(); break;
    case 'pageDown': movePage(id, 1); stRefresh(); break;
    case 'pageTpl': exportPageTemplate(id); break;
    case 'pageDel': deletePage(id); stRefresh(); break;
    case 'import': $('#fileIn').click(); break;
    case 'exportJSON': exportJSON(); break;
    case 'exportHTML': exportHTML(); break;
    case 'exportCSV': exportCSV(live()); break;
    case 'copyDefaults': copyDefaultsJSON(); break;
    case 'saveDefaults': download('dashboard-defaults.json', defaultsJSON(), 'application/json'); break;
    case 'merge': mergeDefaults(); stRefresh(); break;
    case 'reset': resetDefaults(); break;
    case 'health': closeModal(); openBookmarksView({ filter: 'low', sort: 'score', q: '' }); break;
  }
}

function catToDef(c) {
  const o = { name: c.name };
  if (c.icon) o.icon = c.icon;
  if (c.color) o.color = c.color;
  if (c.type !== 'bookmarks') o.type = c.type;
  if (c.span === 2) o.span = 2;
  if (c.sort && c.sort !== 'manual') o.sort = c.sort;
  if (c.content) o.content = c.content;
  if (c.type === 'stocks') o.symbols = c.symbols;
  if (c.type === 'bookmarks') o.bookmarks = catBms(c.id).map(b => {
    const x = { name: b.name, url: b.url };
    if (b.tags.length) x.tags = b.tags;
    if (b.shortcut) x.shortcut = b.shortcut;
    if (b.notes) x.notes = b.notes;
    if (b.pinned) x.pinned = true;
    if (b.icon) x.icon = b.icon;
    return x;
  });
  return o;
}
function defaultsJSON() {
  const s = {};
  for (const k of Object.keys(BASE_SETTINGS)) if (state.settings[k] !== BASE_SETTINGS[k]) s[k] = state.settings[k];
  const inbox = inboxVisible().map(b => ({ name: b.name, url: b.url, ...(b.tags.length ? { tags: b.tags } : {}) }));
  return JSON.stringify({
    storageKey: DEFAULTS.storageKey || 'dashboard', title: state.title,
    pages: state.pages.map(p => ({ name: p.name, categories: pageCats(p.id).map(catToDef) })),

    settings: s,
  }, null, 2);
}

const csvCell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
function exportCSV(list) {

  list.forEach(b => rows.push([b.name, b.url, b.tags.join(';'), b.notes, catOf(b)?.name || 'Inbox', pageOf(b)?.name || '', b.shortcut, b.pinned ? 'yes' : '', new Date(b.created).toISOString(), b.opened ? new Date(b.opened).toISOString() : '', b.openCount || 0, score(b).s]));

function parseCSV(t) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }

}
function importCSV(text) {
  const rows = parseCSV(text.replace(/^﻿/, ''));

  const hd = rows[0].map(h => h.trim().toLowerCase());
  const col = (...names) => hd.findIndex(h => names.includes(h));
  const ci = { name: col('name', 'title'), url: col('url', 'link', 'href', 'address'), tags: col('tags', 'tag', 'labels'), notes: col('notes', 'note', 'description', 'excerpt', 'comment'), cat: col('category', 'folder', 'collection', 'group'), page: col('page') };
  if (ci.url < 0) return toast('The CSV needs a url column.');
  const have = new Set(live().map(b => ukey(b.url)));
  let n = 0, skip = 0, impPage = null;
  const getCat = (cname, pname) => {
    let p = pname ? state.pages.find(x => x.name.toLowerCase() === pname.toLowerCase()) : null;
    if (pname && !p) { p = { id: uid(), name: pname }; state.pages.push(p); }
    if (!p) { if (!impPage) { impPage = { id: uid(), name: 'Imported' }; state.pages.push(impPage); } p = impPage; }
    let c = pageCats(p.id).find(x => x.type === 'bookmarks' && x.name.toLowerCase() === cname.toLowerCase());
    if (!c) { c = mkCat({ name: cname }, p.id); state.categories.push(c); }
    return c.id;
  };
  rows.slice(1).forEach(r => {
    const url = normUrl(r[ci.url] || ''); if (!url || !validUrl(url)) return;
    if (have.has(ukey(url))) { skip++; return; }
    have.add(ukey(url));
    const cname = ci.cat >= 0 ? (r[ci.cat] || '').trim() : '', pname = ci.page >= 0 ? (r[ci.page] || '').trim() : '';
    const b = mkBm({ url, name: ci.name >= 0 ? r[ci.name] : '', tags: ci.tags >= 0 ? (r[ci.tags] || '').split(/[,;|]/) : [], notes: ci.notes >= 0 ? r[ci.notes] : '' }, cname && cname.toLowerCase() !== 'inbox' ? getCat(cname, pname) : null);

}
function importNetscape(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');

  const cats = new Map();
  let n = 0, skip = 0;
  doc.querySelectorAll('a[href]').forEach(a => {
    const url = a.getAttribute('href');
    if (!/^(https?|ftp|file):/i.test(url)) return;
    if (have.has(ukey(url))) { skip++; return; }
    have.add(ukey(url));
    const path = [];
    for (let el = a.parentElement; el; el = el.parentElement) {
      if (el.tagName === 'DL') { const h = el.previousElementSibling; if (h && h.tagName === 'H3') path.unshift(h.textContent.trim()); }
    }
    const cname = path.slice(-2).join(' / ') || 'Bookmarks';
    if (!cats.has(cname)) { const c = mkCat({ name: cname }, page.id); cats.set(cname, c); state.categories.push(c); }
    const dd = a.closest('dt')?.nextElementSibling;
    const b = mkBm({ url, name: a.textContent.trim(), tags: (a.getAttribute('tags') || '').split(','), notes: dd?.tagName === 'DD' ? dd.textContent.trim() : '' }, cats.get(cname).id);
    const ad = +a.getAttribute('add_date'); if (ad) b.created = ad > 1e12 ? Math.floor(ad / 1000) : ad * 1000;

  });

}
function importPage(p) {

function importJSONText(text) {

function importFile(file) {

      d.bookmarks.filter(b => b.categoryId === dc.id).forEach(b => { if (!have.has(ukey(b.url))) { state.bookmarks.push({ ...b, id: uid(), categoryId: c.id }); added++; } });
    });
  });
  d.clocks.forEach(c => {
    const mine = state.clocks.find(x => x.timeZone === c.timeZone);
    if (!mine) state.clocks.push(c);
    else if (!hasLoc(mine) && hasLoc(c)) Object.assign(mine, { lat: c.lat, lon: c.lon, unit: c.unit });
  });
  d.finders.forEach(f => { if (!state.finders.some(x => x.key === f.key)) state.finders.push(f); });
  localStorage.setItem(LS_HASH, DEFAULTS_HASH);
  commit(); toast(added ? `Added ${added} default link(s).` : 'You already have every default link.');
}
